[project]
name = "querysentinel"
version = "0.1.0"
description = "Autonomous PostgreSQL query performance monitoring"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.17.2",
  "apscheduler>=3.11.1,<4",
  "fastapi>=0.163.0",
  "httpx>=0.28.1",
  "mcp>=2.0.0,<3",
  "nicegui>=4.0.0,<5",
  "psycopg[binary]>=3.2.12",
  "pydantic>=2.12.4",
  "pydantic-ai-slim[anthropic,google,openai]>=1.22.0",
  "pydantic-settings>=2.12.0",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.44",
  "structlog>=25.5.0",
  "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.5",
  "testcontainers[postgres]>=4.13",
]

[project.scripts]
querysentinel = "querysentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querysentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: starts disposable PostgreSQL 18 containers",
  "live_ai: disabled-by-default paid OpenAI end-to-end test",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"src/querysentinel/api.py" = ["B008"]
